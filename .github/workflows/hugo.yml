# ============================================================
# GitHub Actions · Hugo 博客
# ============================================================
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ==================== 检出代码 ====================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==================== 构建 Hugo 博客 ====================
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.148.2"
          extended: true

      - name: Build Hugo site
        run: hugo --minify --gc

      # ==================== 部署到 GitHub Pages ====================
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
